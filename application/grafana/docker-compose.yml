version: "3.8"

services:
  # -------------------------
  # Prometheus Service
  # -------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - prometheus-data:/prometheus                     # Persistente Daten
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  # -------------------------
  # Grafana Service
  # -------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana                    # Persistente Dashboards
      - ./grafana/provisioning:/etc/grafana/provisioning:ro # Optional: Provisioning
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  # -------------------------
  # Proxmox Exporter
  # -------------------------
  pve_exporter:
    image: prompve/prometheus-pve-exporter:latest
    container_name: pve_exporter
    network_mode: "host"                                # Host Networking für LAN-Zugriff
    volumes:
      - ./prometheus/pve.yml:/etc/pve.yml:ro
    command: ["--config.file", "/etc/pve.yml", "--web.listen-address", "0.0.0.0:9221"]
    environment:
      PVE_VERIFY_SSL: "false"                        # optional; ggf. bereits über pve.yml
    restart: unless-stopped

# -------------------------
# Persistente Volumes
# -------------------------
volumes:
  prometheus-data:
  grafana-data: